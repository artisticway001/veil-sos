<text x="40" y="850" font-size="16" text-anchor="start" fill="#222" font-weight="800">RULES</text>
<text x="40" y="876" font-size="14" text-anchor="start" fill="#333" font-weight="400">1.  ESP VIN = 5V pin (never the 3V3 pin).  Unplug the 5V wire if the ESP is also on laptop USB.</text>
<text x="40" y="898" font-size="14" text-anchor="start" fill="#333" font-weight="400">2.  All GND tags join together (Arduino GND, LCD, buzzer, LED, button, ESP).</text>
<text x="40" y="920" font-size="14" text-anchor="start" fill="#333" font-weight="400">3.  LCD text not visible? Turn the 10k contrast knob slowly.</text>
<text x="40" y="942" font-size="14" text-anchor="start" fill="#333" font-weight="400">4.  Test with Serial Monitor 9600:  l = LCD   b = buzzer   e = LED   i = inputs   a = ACK wire</text>
