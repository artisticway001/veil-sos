<text x="1095" y="232" font-size="16" text-anchor="middle" fill="#fff" font-weight="800">ESP32 WROOM-32</text>
<polyline points="620,260 960,260" fill="none" stroke="#3a86ff" stroke-width="4" stroke-linecap="round"/>
<rect x="736" y="251" width="48" height="18" rx="3" fill="#e9c46a" stroke="#7a5c00" stroke-width="1.5"/>
<text x="760" y="246" font-size="13" text-anchor="middle" fill="#7a5c00" font-weight="700">1kΩ</text>
<circle cx="960" cy="260" r="7" fill="#ffd166" stroke="#333"/>
<text x="976" y="265" font-size="15" text-anchor="start" fill="#fff" font-weight="800">GPIO27</text>
<text x="870" y="248" font-size="12" text-anchor="middle" fill="#3a86ff" font-weight="700">guard pressed →</text>
<polyline points="620,360 960,360" fill="none" stroke="#ff006e" stroke-width="4" stroke-linecap="round"/>
<circle cx="960" cy="360" r="7" fill="#ffd166" stroke="#333"/>
<text x="976" y="365" font-size="15" text-anchor="start" fill="#fff" font-weight="800">GPIO17 (TX2)</text>
<text x="790" y="348" font-size="12" text-anchor="middle" fill="#ff006e" font-weight="700">← SOS messages</text>
<polyline points="620,460 960,460" fill="none" stroke="#d62828" stroke-width="6" stroke-linecap="round"/>
<circle cx="960" cy="460" r="7" fill="#ffd166" stroke="#333"/>
<text x="976" y="465" font-size="15" text-anchor="start" fill="#fff" font-weight="800">VIN (5V)</text>
<text x="790" y="448" font-size="12" text-anchor="middle" fill="#d62828" font-weight="700">powers the ESP</text>
<polyline points="620,560 960,560" fill="none" stroke="#222" stroke-width="6" stroke-linecap="round"/>
<circle cx="960" cy="560" r="7" fill="#ffd166" stroke="#333"/>
<text x="976" y="565" font-size="15" text-anchor="start" fill="#fff" font-weight="800">GND</text>
<text x="790" y="548" font-size="12" text-anchor="middle" fill="#222" font-weight="700">shared ground</text>
<text x="40" y="690" font-size="14" text-anchor="start" fill="#333" font-weight="400">All GND tags = Arduino GND pin (breadboard - rail).   ESP VIN = 5V pin, never 3V3.   Unplug the 5V wire if the ESP is also on laptop USB.</text>
<text x="40" y="716" font-size="14" text-anchor="start" fill="#333" font-weight="700">Serial Monitor 9600 tests:  b = buzzer   e = LED   s = fake SOS   i = inputs   a = ACK wire to ESP</text>
</svg>